name: Build Jagannatha Hora Standalone Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            artifact: JagannathaHora-Mac
          - os: ubuntu-latest
            artifact: JagannathaHora-Linux
          - os: windows-latest
            artifact: JagannathaHora-Windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build macOS Application (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac

      - name: Build Linux Application (.AppImage & .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb

      - name: Build Windows Application (.exe portable)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win portable

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-package/*
